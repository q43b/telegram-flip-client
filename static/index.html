<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG Flip</title>
<style>
  body { font-family: sans-serif; font-size: 18px; margin: 0; }
  #chats button { display: block; width: 100%; text-align: left; padding: 10px;
                  font-size: 18px; border: 0; border-bottom: 1px solid #ccc; background: #fff; }
  button:focus, input:focus { outline: 3px solid #0057d9; }
  #messages { padding: 8px; }
  .msg { margin: 6px 0; padding: 6px; border-radius: 6px; background: #eee;
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.out { background: #d6f5d6; text-align: right; }
  #compose { display: flex; gap: 4px; padding: 8px; }
  #text { flex: 1; font-size: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="err" style="color:#b00;padding:4px"></div>
<div id="status" style="color:#b00;padding:4px"></div>
<script>
window.onerror = function (msg, src, line) {
  document.getElementById("err").textContent = "JS error: " + msg + " (line " + line + ")";
};
</script>

<div id="chatsView">
  <h2>Chats</h2>
  <div id="chats"></div>
</div>

<div id="chatView" class="hidden">
  <button id="back">Back</button>
  <button id="markRead" class="hidden">Mark as read</button>
  <h2 id="title"></h2>
  <div id="messages"></div>
  <div id="compose">
    <input id="text" placeholder="Message">
    <button id="send">Send</button>
  </div>
</div>

<script>
// ---------- state ----------
var token = localStorage.getItem("token");
if (location.hash.indexOf("#token=") === 0) {
  token = decodeURIComponent(location.hash.slice(7));
  localStorage.setItem("token", token);
  history.replaceState(null, "", location.pathname);
}
if (!token) {
  token = prompt("Token:");
  localStorage.setItem("token", token);
}
var currentChat = null;
var chatList = [];
var shown = {};
var ws = null;
var lastNav = 0;

// ---------- talking to the server ----------
function showError(msg) { document.getElementById("err").textContent = msg; }
function clearError() { document.getElementById("err").textContent = ""; }

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "x-token": token, "Content-Type": "application/json" },
  });
  if (res.status === 401) {
    localStorage.removeItem("token");
    alert("Bad token. Reload the page.");
    throw new Error("401");
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

// ---------- chat list ----------
function renderChats() {
  var focusedId = document.activeElement && document.activeElement.dataset
    ? document.activeElement.dataset.id : null;
  var box = document.getElementById("chats");
  box.innerHTML = "";
  chatList.forEach(function (c) {
    var b = document.createElement("button");
    b.dataset.id = c.id;
    b.textContent = c.name + (c.unread ? " (" + c.unread + ")" : "");
    b.onclick = function () { openChat(c.id, c.name); };
    box.appendChild(b);
  });
  var target = focusedId ? box.querySelector('[data-id="' + focusedId + '"]') : null;
  if (target) target.focus();
}

async function loadChats() {
  chatList = await api("/chats");
  renderChats();
  var first = document.querySelector("#chats button");
  if (first) first.focus();
}

async function refreshChats() {
  try {
    chatList = await api("/chats");
    renderChats();
    if (currentChat !== null) updateMarkRead();
  } catch (e) {}
}

function getChat(id) {
  for (var i = 0; i < chatList.length; i++) {
    if (chatList[i].id === id) return chatList[i];
  }
  return null;
}

// ---------- the "Mark as read" button ----------
function updateMarkRead() {
  var c = getChat(currentChat);
  var btn = document.getElementById("markRead");
  if (c && c.unread) {
    btn.classList.remove("hidden");
  } else {
    if (document.activeElement === btn) document.getElementById("text").focus();
    btn.classList.add("hidden");
  }
}

document.getElementById("markRead").onclick = async function () {
  try {
    await api("/read/" + currentChat, { method: "POST" });
    var c = getChat(currentChat);
    if (c) c.unread = 0;
    updateMarkRead();
    document.getElementById("text").focus();
  } catch (e) {
    showError("Could not mark as read: " + e.message);
  }
};

// ---------- one chat ----------
async function openChat(id, name) {
  currentChat = id;
  document.getElementById("title").textContent = name;
  document.getElementById("chatsView").classList.add("hidden");
  document.getElementById("chatView").classList.remove("hidden");
  updateMarkRead();
  try {
    await loadMessages();
    clearError();
  } catch (e) {
    showError("Could not load messages: " + e.message);
  }
  document.getElementById("text").focus();
}

function addMessage(m) {
  if (shown[m.id]) return;
  shown[m.id] = true;
  var box = document.getElementById("messages");
  var d = document.createElement("div");
  d.className = "msg" + (m.out ? " out" : "");
  d.textContent = m.text || "[non-text message]";
  box.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}

async function loadMessages() {
  const msgs = await api("/messages/" + currentChat);
  document.getElementById("messages").innerHTML = "";
  shown = {};
  for (const m of msgs) addMessage(m);
}

async function sendMessage() {
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  try {
    await api("/send", { method: "POST", body: JSON.stringify({ chat_id: currentChat, text }) });
    input.value = "";
    clearError();
    await loadMessages();
  } catch (e) {
    showError("Send failed: " + e.message + ". Your text is kept.");
  }
}

// ---------- live messages (WebSocket) ----------
function connectWs() {
  var proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(proto + location.host + "/ws");
  ws.onopen = function () {
    ws.send(token);
    document.getElementById("status").textContent = "";
    resync();
  };
  ws.onmessage = function (e) {
    var m = JSON.parse(e.data);
    if (m.type === "read") { refreshChats(); return; }
    var chatOpen = currentChat !== null && m.chat_id === currentChat &&
      !document.getElementById("chatView").classList.contains("hidden");
    if (chatOpen) addMessage(m);

    var found = false;
    for (var i = 0; i < chatList.length; i++) {
      if (chatList[i].id === m.chat_id) {
        if (!m.out) chatList[i].unread = (chatList[i].unread || 0) + 1;
        chatList.unshift(chatList.splice(i, 1)[0]);
        found = true;
        break;
      }
    }
    if (chatOpen) updateMarkRead();
    var listVisible = !document.getElementById("chatsView").classList.contains("hidden");
    if (!found) { if (listVisible) loadChats(); return; }
    if (listVisible) renderChats();
  };
  ws.onclose = function () {
    document.getElementById("status").textContent = "Offline - reconnecting...";
    setTimeout(connectWs, 3000);
  };
}

async function resync() {
  await refreshChats();
  if (currentChat !== null &&
      !document.getElementById("chatView").classList.contains("hidden")) {
    try { await loadMessages(); } catch (e) {}
  }
}

// ---------- buttons and keys ----------
document.getElementById("send").onclick = sendMessage;
document.getElementById("text").onkeydown = function (e) { if (e.key === "Enter") sendMessage(); };
document.getElementById("back").onclick = function () {
  document.getElementById("chatView").classList.add("hidden");
  document.getElementById("chatsView").classList.remove("hidden");
  loadChats();
};

function focusables() {
  return Array.from(document.querySelectorAll("button, input"))
    .filter(function (el) { return el.offsetParent !== null; });
}

document.addEventListener("keydown", function (e) {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  e.stopImmediatePropagation();
  var now = Date.now();
  if (now - lastNav < 100) return;
  lastNav = now;
  var items = focusables();
  if (items.length === 0) return;
  var i = items.indexOf(document.activeElement);
  var next = e.key === "ArrowDown"
    ? items[(i + 1) % items.length]
    : items[(i - 1 + items.length) % items.length];
  next.focus();
  next.scrollIntoView(false);
});

// F2 soft key = "Mark as read" while a chat is open
document.addEventListener("keydown", function (e) {
  if (e.key !== "F2") return;
  if (document.getElementById("chatView").classList.contains("hidden")) return;
  e.preventDefault();
  var b = document.getElementById("markRead");
  if (!b.classList.contains("hidden")) b.click();
});

// ---------- start ----------
connectWs();
loadChats().catch(function (e) {
  showError("Error: " + e.message);
});
</script>
</body>
</html>
